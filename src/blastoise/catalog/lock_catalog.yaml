      duration_model: PROPORTIONAL_TO_ROWS
      source:
        - "doc:18/datatype-numeric.html#DATATYPE-SERIAL: 'serial ... is equivalent to ... DEFAULT nextval('tablename_colname_seq')'"
        - "src:REL_18_STABLE/src/backend/commands/tablecmds.c ATExecAddColumn: nextval() is volatile -> tab->rewrite |= AT_REWRITE_DEFAULT_VAL"
