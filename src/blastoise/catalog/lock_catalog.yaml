  # --- reindex: 11 wild (0.1%) ---------------------------------------------
  reindex:
    - pg_versions: [10, 18]
      when: {scope: index}
      calibration: CALIBRATED
      lock_mode: ACCESS EXCLUSIVE
      blocks_reads: true
      blocks_writes: true
      requires_table_rewrite: false
      duration_model: PROPORTIONAL_TO_INDEX_SIZE
      affected_relations:
        - {role: target, lock_mode: ACCESS EXCLUSIVE}
        - {role: owning_table, lock_mode: SHARE}
      source:
        - "doc:18/sql-reindex.html §Notes: 'REINDEX locks out writes but not reads of the index's parent table. It also takes an ACCESS EXCLUSIVE lock on the specific index being processed, which will block reads that attempt to use that index. In particular, the query planner tries to take an ACCESS SHARE lock on every index of the table, regardless of the query, and so REINDEX blocks virtually any queries except for some prepared queries whose plan has been cached and which don't use this very index.'"
        - "src:REL_18_STABLE/src/backend/catalog/index.c reindex_index: heapRelation = table_open(heapId, ShareLock); iRel = index_open(indexId, AccessExclusiveLock)"
      notes: "REINDEX INDEX: the target is the index (ACCESS EXCLUSIVE on it, SHARE on the owning table). Rebuilds by scanning the heap, so the duration is the full index build; writers block for all of it and, because planning takes ACCESS SHARE on every index, most new queries on the table block too. Can run inside a transaction block."
    - pg_versions: [10, 18]
      when: {scope: table}
      calibration: CALIBRATED
      lock_mode: SHARE
      blocks_reads: false
      blocks_writes: true
      requires_table_rewrite: false
      duration_model: PROPORTIONAL_TO_ROWS
      affected_relations:
        - {role: target, lock_mode: SHARE}
        - {role: dependent_relations, lock_mode: ACCESS EXCLUSIVE}
      source:
        - "src:REL_18_STABLE/src/backend/catalog/index.c reindex_relation: 'Open and lock the parent heap relation. ShareLock is sufficient since we only need to be sure no schema or data changes are going on.'; each index is then rebuilt via reindex_index under AccessExclusiveLock"
        - "doc:18/sql-reindex.html §Notes (as above)"
      notes: "REINDEX TABLE: SHARE on the table for the whole run and ACCESS EXCLUSIVE on each of its indexes (dependent_relations) in turn, so effectively all queries on the table are blocked while every index is rebuilt from the heap. PG 14+ also processes partitioned tables' children."
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: SHARE
      blocks_reads: false
      blocks_writes: true
      requires_table_rewrite: false
      duration_model: PROPORTIONAL_TO_ROWS
      requires_live_context: true
      live_context: "which tables the schema/database/system contains — every one is reindexed in turn"
      transaction_block: FORBIDDEN
      affected_relations:
        - {role: dependent_relations, lock_mode: SHARE}
      source:
        - "src:REL_18_STABLE/src/backend/commands/indexcmds.c ReindexMultipleTables: every table in the schema/database is reindexed via reindex_relation (SHARE on the table, ACCESS EXCLUSIVE per index), one transaction per table"
        - "doc:18/sql-reindex.html §SCHEMA/DATABASE/SYSTEM"
      notes: "Default row (scope schema/database/system): iterates every table, one transaction each; the set of relations is unknown statically. REINDEX SCHEMA/DATABASE/SYSTEM cannot run inside a transaction block."

