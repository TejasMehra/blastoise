        - "src:REL_18_STABLE/src/backend/commands/tablecmds.c ExecuteTruncate: LOCKMODE lockmode = AccessExclusiveLock; CASCADE: rel = table_open(relid, AccessExclusiveLock) for each FK-referencing table ('truncate cascades to table'); RESTART IDENTITY: seq_rel = relation_open(seq_relid, AccessExclusiveLock)"
        - "doc:18/sql-truncate.html §Notes: 'TRUNCATE is not MVCC-safe.'"
      notes: "O(1) — the files are replaced, not the rows scanned — but ACCESS EXCLUSIVE on every table truncated (and every table CASCADE reaches, unknown statically). RESTART IDENTITY also locks the owned sequences ACCESS EXCLUSIVE. Queues behind every in-flight query on those tables."

