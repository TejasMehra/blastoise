# ===========================================================================
# ALTER TABLE SUBCOMMANDS — wild-frequency order (3,162 ALTER TABLE statements)
#
# Every subcommand is resolved through AlterTableGetLockLevel() in
# src/backend/commands/tablecmds.c, which picks the lock per subcommand and
# takes the STRONGEST over the whole statement; see resolve.statement_lock_mode.
# The `target` role is the ALTER TABLE's table.
# ===========================================================================
alter_table_actions:

  # --- add_column: 873 wild (nullable, no default) --------------------------
  add_column:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: ACCESS EXCLUSIVE
      blocks_reads: true
      blocks_writes: true
      requires_table_rewrite: false
      duration_model: CONSTANT
      affected_relations:
        - {role: target, lock_mode: ACCESS EXCLUSIVE}
        - {role: referenced_table, lock_mode: SHARE ROW EXCLUSIVE, optional: true}
      source:
        - "src:REL_18_STABLE/src/backend/commands/tablecmds.c AlterTableGetLockLevel: AT_AddColumn /* may rewrite heap, in some cases and visible to SELECT */ -> AccessExclusiveLock"
        - "doc:10/sql-altertable.html §ADD COLUMN: 'If there is no DEFAULT clause, this is merely a metadata change and does not require any immediate update of the table's data; the added NULL values are supplied on readout, instead.'"
        - "doc:18/sql-altertable.html#SQL-ALTERTABLE-NOTES: 'If no column constraints are specified, NULL is used as the DEFAULT. In neither case is a rewrite of the table required.'"
        - "src:REL_18_STABLE/src/backend/commands/tablecmds.c ATAddForeignKeyConstraint: pkrel = table_openrv(fkconstraint->pktable, ShareRowExclusiveLock) — an inline REFERENCES clause becomes an ADD CONSTRAINT on the same table"
      notes: "Catalog-only: existing rows read back NULL. ACCESS EXCLUSIVE is brief — the danger is queueing behind a long query/transaction and then stalling everyone behind it, not the work itself. An inline REFERENCES clause also locks the referenced table SHARE ROW EXCLUSIVE (no validation scan: every existing row is NULL)."

  # --- add_column_default_nonvolatile: 728 wild ----------------------------
  add_column_default_nonvolatile:
    - pg_versions: [10, 10]
      calibration: CALIBRATED
      lock_mode: ACCESS EXCLUSIVE
      blocks_reads: true
      blocks_writes: true
      requires_table_rewrite: true
      duration_model: PROPORTIONAL_TO_ROWS
      affected_relations:
        - {role: target, lock_mode: ACCESS EXCLUSIVE}
        - {role: referenced_table, lock_mode: SHARE ROW EXCLUSIVE, optional: true}
      source:
        - "doc:10/sql-altertable.html §Notes: 'Adding a column with a DEFAULT clause or changing the type of an existing column will require the entire table and its indexes to be rewritten.'"
        - "src:REL_10_STABLE/src/backend/commands/tablecmds.c ATExecAddColumn: 'if (defval) { ... tab->rewrite |= AT_REWRITE_DEFAULT_VAL; }' (unconditional on any default)"
      notes: "PG 10 and older: ANY default — constant, immutable or stable — forces a full table rewrite under ACCESS EXCLUSIVE (all indexes rebuilt, 2x disk)."
    - pg_versions: [11, 18]
      calibration: CALIBRATED
      lock_mode: ACCESS EXCLUSIVE
      blocks_reads: true
      blocks_writes: true
      requires_table_rewrite: false
      duration_model: CONSTANT
      requires_live_context: true
      live_context: "whether the column's type is a domain with constraints (the IR records the type name, not whether it is a domain): a constrained domain disables the fast path and rewrites"
      affected_relations:
        - {role: target, lock_mode: ACCESS EXCLUSIVE}
        - {role: referenced_table, lock_mode: SHARE ROW EXCLUSIVE, optional: true}
      source:
        - "doc:11/sql-altertable.html §Notes: 'When a column is added with ADD COLUMN and a non-volatile DEFAULT is specified, the default is evaluated at the time of the statement and the result stored in the table's metadata. That value will be used for the column for all existing rows. If no DEFAULT is specified, NULL is used. In neither case is a rewrite of the table required.'"
        - "doc:18/sql-altertable.html#SQL-ALTERTABLE-NOTES: 'Adding a column with a volatile DEFAULT (e.g., clock_timestamp()), a stored generated column, an identity column, or a column with a domain data type that has constraints will cause the entire table and its indexes to be rewritten.'"
        - "src:REL_18_STABLE/src/backend/commands/tablecmds.c ATExecAddColumn: 'Attempt to skip a complete table rewrite by storing the specified DEFAULT value outside of the heap ... the default expression can't be volatile (stable is OK)' — if (rel->rd_rel->relkind == RELKIND_RELATION && !colDef->generated && !has_domain_constraints && !contain_volatile_functions(defval)) StoreAttrMissingVal(...)"
        - "release:11 'Allow ALTER TABLE to add a column with a non-null column default without doing a table rewrite'"
      notes: "The fast-default path: the value is evaluated once and stored in pg_attribute.attmissingval; existing rows read it back. Brief ACCESS EXCLUSIVE only. Applies to constant, immutable AND stable defaults (now() is fine). NOT NULL with such a default is equally fast."

  # --- add_column_default_volatile: 9 wild (gen_random_uuid() mostly) ------
  add_column_default_volatile:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: ACCESS EXCLUSIVE
      blocks_reads: true
      blocks_writes: true
      requires_table_rewrite: true
      duration_model: PROPORTIONAL_TO_ROWS
      affected_relations:
        - {role: target, lock_mode: ACCESS EXCLUSIVE}
        - {role: referenced_table, lock_mode: SHARE ROW EXCLUSIVE, optional: true}
      source:
        - "doc:18/sql-altertable.html#SQL-ALTERTABLE-NOTES: 'Adding a column with a volatile DEFAULT (e.g., clock_timestamp()), a stored generated column, an identity column, or a column with a domain data type that has constraints will cause the entire table and its indexes to be rewritten.'"
        - "src:REL_18_STABLE/src/backend/commands/tablecmds.c ATExecAddColumn: 'Failed to use missing mode. We have to do a table rewrite to install the value' -> tab->rewrite |= AT_REWRITE_DEFAULT_VAL"
      notes: "Every version: a volatile default (gen_random_uuid(), random(), clock_timestamp(), nextval()) must be evaluated per row, so the whole table and all its indexes are rewritten under ACCESS EXCLUSIVE. Safe recipe: add the column nullable, backfill in batches, then SET DEFAULT for future rows."

  # --- add_column_default_unknown_volatility: 8 wild (custom functions) ----
  add_column_default_unknown_volatility:
    - pg_versions: [10, 10]
      calibration: CALIBRATED
      lock_mode: ACCESS EXCLUSIVE
      blocks_reads: true
      blocks_writes: true
      requires_table_rewrite: true
      duration_model: PROPORTIONAL_TO_ROWS
      affected_relations:
        - {role: target, lock_mode: ACCESS EXCLUSIVE}
        - {role: referenced_table, lock_mode: SHARE ROW EXCLUSIVE, optional: true}
      source:
        - "doc:10/sql-altertable.html §Notes: 'Adding a column with a DEFAULT clause or changing the type of an existing column will require the entire table and its indexes to be rewritten.'"
      notes: "PG 10 and older rewrite on any default, so volatility does not matter."
    - pg_versions: [11, 18]
      calibration: CALIBRATED
      lock_mode: ACCESS EXCLUSIVE
      blocks_reads: true
      blocks_writes: true
      requires_table_rewrite: true
      duration_model: PROPORTIONAL_TO_ROWS
      requires_live_context: true
      live_context: "pg_proc.provolatile of the user-defined function(s) in the default: 'v' (the default for CREATE FUNCTION) rewrites, 'i'/'s' takes the fast path"
      affected_relations:
        - {role: target, lock_mode: ACCESS EXCLUSIVE}
        - {role: referenced_table, lock_mode: SHARE ROW EXCLUSIVE, optional: true}
      source:
        - "src:REL_18_STABLE/src/backend/commands/tablecmds.c ATExecAddColumn: !contain_volatile_functions((Node *) defval) gates the fast path; user functions default to VOLATILE"
      notes: "The classifier could not prove the default non-volatile (a user-defined function). Modeled as the worst case (rewrite) because CREATE FUNCTION defaults to VOLATILE; a function declared IMMUTABLE/STABLE takes the PG 11+ fast path."

  # --- add_column_serial: 6 / add_column_identity: 5 / generated: 79 + 0 --
  add_column_serial:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: ACCESS EXCLUSIVE
