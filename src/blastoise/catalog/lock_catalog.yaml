      blocks_reads: false
      blocks_writes: true
      write_block_scope: MATCHED_ROWS
      row_locks: "FOR NO KEY UPDATE on each matched row (FOR UPDATE if a key column changes)"
      requires_table_rewrite: false
      duration_model: PROPORTIONAL_TO_ROWS_MATCHED
      requires_live_context: true
      live_context: "the batch size the idiom bounds (LIMIT n is visible; a key window's width in rows is not) — each statement is bounded, but a migration file usually repeats it or it is one step of an external loop"
      source:
        - "doc:18/explicit-locking.html#LOCKING-TABLES: 'The commands UPDATE, DELETE, INSERT, and MERGE acquire this lock mode [ROW EXCLUSIVE] on the target table'"
        - "doc:18/explicit-locking.html#LOCKING-ROWS: 'FOR NO KEY UPDATE ... is also acquired by any UPDATE that does not acquire a FOR UPDATE lock'"
      notes: "A recognized batching idiom (LIMIT-bounded subselect/CTE, ctid targeting, two-sided key window) bounds the rows matched per statement, so row locks and bloat are bounded per statement. The statement is still PROPORTIONAL_TO_ROWS_MATCHED; it is the bound that makes it safe."

