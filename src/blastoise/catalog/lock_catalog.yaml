# blastoise lock semantics catalog.
#
# One row per statement classification x Postgres major-version range x
# optional IR-shape variant (`when`). Rows are ordered by how often the kind
# appears in the 3,081-file wild corpus (see DECISIONS.md), not alphabetically.
# Every row carries `source` citations so it can be audited on its own:
#   doc:<ver>/<page>#<anchor or §heading>   Postgres documentation
#   src:<branch>/<path> <function>: <fact>  Postgres source
#   release:<ver> '<release note item>'     major-version release notes
#
# Field semantics (validated by catalog/loader.py):
#   pg_versions            [min, max] inclusive majors the row applies to
#   calibration            CALIBRATED = researched this session against docs/source;
#                          UNCALIBRATED = explicit stub (never seen in the wild corpus,
#                          or not verified) — values are provisional, never a default
#   available              false: the form does not exist in these versions (syntax error)
#   lock_mode              strongest lock on the primary relation (`target` role);
#                          NONE = no relation-level lock; UNKNOWN only for OTHER kinds
#   blocks_reads/writes    does the lock stop concurrent SELECT / INSERT-UPDATE-DELETE
#                          on the primary relation (checked against conflict_matrix)
#   write_block_scope      TABLE (table lock) | MATCHED_ROWS (row locks) | NONE
#   requires_table_rewrite a new heap is written (2x disk, full WAL, long AEL)
#   duration_model         CONSTANT | PROPORTIONAL_TO_ROWS | PROPORTIONAL_TO_INDEX_SIZE |
#                          PROPORTIONAL_TO_ROWS_MATCHED | UNKNOWN
#   requires_live_context  the row states the worst case; live schema/data would narrow it
#   transaction_block      ALLOWED | FORBIDDEN | RESTRICTED (see notes)
#   affected_relations     every relation locked, by IR role; default = target only
#   when                   IR-field predicate selecting this row over the default row

schema_version: 1

# Majors the catalog speaks about. Bumping max forces a re-audit: every row
# must be extended explicitly (coverage is validated per version).
version_domain: {min: 10, max: 18}

# doc:18/explicit-locking.html#LOCKING-TABLES, Table 13.2 "Conflicting Lock Modes".
# Symmetric by construction of the docs table; validated symmetric + complete.
conflict_matrix:
  ACCESS SHARE: [ACCESS EXCLUSIVE]
  ROW SHARE: [EXCLUSIVE, ACCESS EXCLUSIVE]
  ROW EXCLUSIVE: [SHARE, SHARE ROW EXCLUSIVE, EXCLUSIVE, ACCESS EXCLUSIVE]
  SHARE UPDATE EXCLUSIVE: [SHARE UPDATE EXCLUSIVE, SHARE, SHARE ROW EXCLUSIVE, EXCLUSIVE, ACCESS EXCLUSIVE]
  SHARE: [ROW EXCLUSIVE, SHARE UPDATE EXCLUSIVE, SHARE ROW EXCLUSIVE, EXCLUSIVE, ACCESS EXCLUSIVE]
  SHARE ROW EXCLUSIVE: [ROW EXCLUSIVE, SHARE UPDATE EXCLUSIVE, SHARE, SHARE ROW EXCLUSIVE, EXCLUSIVE, ACCESS EXCLUSIVE]
  EXCLUSIVE: [ROW SHARE, ROW EXCLUSIVE, SHARE UPDATE EXCLUSIVE, SHARE, SHARE ROW EXCLUSIVE, EXCLUSIVE, ACCESS EXCLUSIVE]
  ACCESS EXCLUSIVE: [ACCESS SHARE, ROW SHARE, ROW EXCLUSIVE, SHARE UPDATE EXCLUSIVE, SHARE, SHARE ROW EXCLUSIVE, EXCLUSIVE, ACCESS EXCLUSIVE]

# Registry of known behavior changes. The loader rejects any row of `kind`
# that spans `version - 1` and `version`, so a change listed here forces
# separate rows instead of a caveat.
version_breakpoints:
  - kind: alter_table_action/add_column_default_nonvolatile
    version: 11
    what_changed: "ADD COLUMN with a non-volatile DEFAULT stores the value in pg_attribute.attmissingval instead of rewriting the table"
    source: "release:11 'Allow ALTER TABLE to add a column with a non-null default without doing a table rewrite'; src:REL_11_STABLE tablecmds.c ATExecAddColumn StoreAttrMissingVal"
  - kind: alter_table_action/add_column_default_unknown_volatility
    version: 11
    what_changed: "before 11 any DEFAULT rewrote; from 11 only a volatile one does, so unknown volatility needs live context"
    source: "src:REL_10_STABLE tablecmds.c ATExecAddColumn: 'if (defval) ... tab->rewrite |= AT_REWRITE_DEFAULT_VAL' (unconditional)"
  - kind: alter_table_action/add_column_generated_stored
    version: 12
    what_changed: "generated columns introduced"
    source: "release:12 'Add support for generated columns'"
  - kind: alter_table_action/add_column_generated_virtual
    version: 18
    what_changed: "virtual generated columns introduced"
    source: "release:18 'Allow generated columns to be virtual, and make them the default'"
  - kind: alter_table_action/set_not_null
    version: 12
    what_changed: "the verification scan is skipped when a valid CHECK constraint proves the column NOT NULL"
    source: "release:12 'Allow ALTER TABLE ... SET NOT NULL to avoid unnecessary table scans'; src:REL_12_STABLE tablecmds.c NotNullImpliedByRelConstraints"
  - kind: alter_table_action/drop_expression
    version: 13
    what_changed: "DROP EXPRESSION introduced"
    source: "release:13 'Add ALTER TABLE ... DROP EXPRESSION'"
  - kind: alter_table_action/set_expression
    version: 17
    what_changed: "SET EXPRESSION introduced"
    source: "release:17 'Allow ALTER TABLE to change a column''s generation expression'"
  - kind: alter_table_action/set_compression
    version: 14
    what_changed: "SET COMPRESSION introduced"
    source: "release:14 'Allow per-column compression methods'"
  - kind: alter_table_action/set_access_method
    version: 15
    what_changed: "SET ACCESS METHOD introduced"
    source: "release:15 'Allow ALTER TABLE to modify a table''s ACCESS METHOD'"
  - kind: alter_table_action/add_not_null_constraint
    version: 18
    what_changed: "NOT NULL constraints stored in pg_constraint; ADD CONSTRAINT ... NOT NULL form introduced"
    source: "release:18 'Store column NOT NULL specifications in pg_constraint'"
  - kind: alter_table_action/add_not_null_constraint_not_valid
    version: 18
    what_changed: "NOT VALID NOT NULL constraints introduced"
    source: "release:18 'Allow ALTER TABLE to set the NOT VALID attribute of NOT NULL constraints'"
  - kind: alter_table_action/attach_partition
    version: 12
    what_changed: "parent lock reduced from ACCESS EXCLUSIVE to SHARE UPDATE EXCLUSIVE"
    source: "release:12 'ALTER TABLE ATTACH PARTITION is now performed with reduced locking requirements'; src:REL_11_STABLE vs REL_12_STABLE tablecmds.c AlterTableGetLockLevel AT_AttachPartition"
  - kind: alter_table_action/detach_partition_concurrently
    version: 14
    what_changed: "DETACH PARTITION CONCURRENTLY introduced"
    source: "release:14 'Allow partitions to be detached in a non-blocking manner'"
  - kind: alter_table_action/detach_partition_finalize
    version: 14
    what_changed: "DETACH PARTITION FINALIZE introduced"
    source: "release:14 'Allow partitions to be detached in a non-blocking manner'"
  - kind: statement/create_index_concurrently
    version: 14
    what_changed: "no longer waits for other CREATE/REINDEX CONCURRENTLY operations on unrelated tables"
    source: "release:14 'Allow index commands using CONCURRENTLY to avoid waiting for the completion of other operations using CONCURRENTLY'"
  - kind: statement/reindex_concurrently
    version: 12
    what_changed: "REINDEX CONCURRENTLY introduced"
    source: "release:12 'Add REINDEX CONCURRENTLY option'"
  - kind: statement/reindex_concurrently
    version: 14
    what_changed: "no longer waits for other CONCURRENTLY index operations"
    source: "release:14 'Allow index commands using CONCURRENTLY to avoid waiting for the completion of other operations using CONCURRENTLY'"
  - kind: statement/rename_index
    version: 12
    what_changed: "ALTER INDEX ... RENAME takes SHARE UPDATE EXCLUSIVE instead of ACCESS EXCLUSIVE"
    source: "release:12 'Reduce locking requirements for index renaming'; src:REL_11_STABLE vs REL_12_STABLE tablecmds.c RenameRelation"
  - kind: statement/alter_enum_add_value
    version: 12
    what_changed: "allowed inside a transaction block; the new value is unusable until commit"
    source: "release:12 'Allow enumerated values to be added more flexibly'; doc:11/sql-altertype.html vs doc:12/sql-altertype.html"
  - kind: statement/alter_enum_add_value
    version: 17
    what_changed: "a value added to an enum type created in the same transaction is usable immediately"
    source: "release:17 'Allow the use of an ENUM added via ALTER TYPE if the type was created in the same transaction'"
  - kind: statement/grant
    version: 18
    what_changed: "GRANT on tables/sequences locks the relation ACCESS SHARE (previously NoLock)"
    source: "src:REL_17_STABLE aclchk.c objectNamesToOids: RangeVarGetRelid(relvar, NoLock, false); src:REL_18_STABLE aclchk.c objectNamesToOids: const LOCKMODE lockmode = AccessShareLock"
  - kind: statement/revoke
    version: 18
    what_changed: "REVOKE on tables/sequences locks the relation ACCESS SHARE (previously NoLock)"
    source: "src:REL_17_STABLE vs REL_18_STABLE aclchk.c objectNamesToOids"
  - kind: statement/create_procedure
    version: 11
    what_changed: "procedures introduced"
    source: "release:11 'Add SQL procedures'"
  - kind: statement/drop_procedure
    version: 11
    what_changed: "procedures introduced"
    source: "release:11 'Add SQL procedures'"
  - kind: statement/call
    version: 11
    what_changed: "CALL introduced"
    source: "release:11 'Add SQL procedures'"
  - kind: statement/merge
    version: 15
    what_changed: "MERGE introduced"
    source: "release:15 'Add SQL MERGE command'"

# Kinds that are not looked up directly.
statement_resolution:
  alter_table: per_action        # one row per subcommand; statement lock = strongest (AlterTableGetLockLevel)
  do_block: inner_statements     # the DO itself locks nothing; embedded statements are resolved

# ===========================================================================
# STATEMENT KINDS — wild-frequency order
# ===========================================================================
statements:

  # --- create_index: 1,875 wild (12.1%) -----------------------------------
  create_index:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: SHARE
      blocks_reads: false
      blocks_writes: true
      requires_table_rewrite: false
      duration_model: PROPORTIONAL_TO_ROWS
      source:
        - "doc:18/explicit-locking.html#LOCKING-TABLES: 'SHARE ... Acquired by CREATE INDEX (without CONCURRENTLY)'"
        - "doc:18/sql-createindex.html#SQL-CREATEINDEX-CONCURRENTLY: 'Normally PostgreSQL locks the table to be indexed against writes and performs the entire index build with a single scan of the table. Other transactions can still read the table, but if they try to insert, update, or delete rows in the table they will block until the index build is finished.'"
        - "src:REL_18_STABLE/src/backend/commands/indexcmds.c DefineIndex: lockmode = concurrent ? ShareUpdateExclusiveLock : ShareLock"
      notes: "Single full scan; writers block for the whole build and queue behind it. On a partitioned table (PG 11+) the same SHARE lock is taken on every partition as the index is built recursively; ON ONLY parent (statement.only) creates an invalid parent index without touching partitions. Can run inside a transaction block."

  # --- comment_on: 1,348 wild (8.7%) ---------------------------------------
  comment_on:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: SHARE UPDATE EXCLUSIVE
      blocks_reads: false
      blocks_writes: false
      requires_table_rewrite: false
      duration_model: CONSTANT
      affected_relations:
        - {role: target, lock_mode: SHARE UPDATE EXCLUSIVE, optional: true}
      source:
        - "doc:18/explicit-locking.html#LOCKING-TABLES: 'SHARE UPDATE EXCLUSIVE ... Acquired by VACUUM (without FULL), ANALYZE, CREATE INDEX CONCURRENTLY, CREATE STATISTICS, COMMENT ON, REINDEX CONCURRENTLY ...'"
        - "src:REL_18_STABLE/src/backend/commands/comment.c CommentObject: get_object_address(..., &relation, ShareUpdateExclusiveLock, false)"
      notes: "Catalog-only write to pg_description. For relation-attached objects (table, column, index, constraint, trigger, rule, policy) the relation is locked SHARE UPDATE EXCLUSIVE: no reads or writes are blocked, but it queues behind a running VACUUM, CREATE INDEX CONCURRENTLY, or ALTER TABLE on the same table. Comments on non-relation objects (functions, types, schemas, extensions) take no relation lock. The classifier does not decode the commented object, so the target is unnamed."

  # --- create_table: 1,188 wild (7.7%) -------------------------------------
  create_table:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: NONE
      blocks_reads: false
      blocks_writes: false
      requires_table_rewrite: false
      duration_model: CONSTANT
      affected_relations:
        - {role: referenced_tables, lock_mode: SHARE ROW EXCLUSIVE, optional: true}
      source:
        - "src:REL_18_STABLE/src/backend/commands/tablecmds.c ATAddForeignKeyConstraint: pkrel = table_openrv(fkconstraint->pktable, ShareRowExclusiveLock) (inline REFERENCES/FOREIGN KEY clauses are processed through this path by DefineRelation -> AlterTableInternal)"
        - "doc:18/sql-altertable.html §ADD table_constraint: 'ADD FOREIGN KEY also acquires a SHARE ROW EXCLUSIVE lock on the referenced table'"
        - "src:REL_18_STABLE/src/backend/commands/tablecmds.c DefineRelation: parentLockmode = (stmt->partbound != NULL ? AccessExclusiveLock : ShareUpdateExclusiveLock) for INHERITS parents"
      notes: "The new relation is invisible to other sessions, so its ACCESS EXCLUSIVE lock is harmless. Pre-existing tables named by REFERENCES / FOREIGN KEY clauses are locked SHARE ROW EXCLUSIVE (FK triggers are added to them): writers to those tables block briefly and the statement waits for in-flight writers. INHERITS parents are locked SHARE UPDATE EXCLUSIVE (not modeled as a role: the IR records only the flag)."

  # --- create_trigger: 1,007 wild (6.5%) -----------------------------------
  create_trigger:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: SHARE ROW EXCLUSIVE
      blocks_reads: false
      blocks_writes: true
      requires_table_rewrite: false
      duration_model: CONSTANT
      source:
        - "doc:18/explicit-locking.html#LOCKING-TABLES: 'SHARE ROW EXCLUSIVE ... Acquired by CREATE TRIGGER and some forms of ALTER TABLE.'"
        - "src:REL_17_STABLE/src/backend/commands/trigger.c CreateTriggerFiringOn: rel = table_open(relOid, ShareRowExclusiveLock)"
      notes: "Catalog-only (pg_trigger row plus a relcache invalidation): the lock is held only for the statement's own duration. Reads continue; writers block until the creating transaction commits, and the statement waits for in-flight writers (ROW EXCLUSIVE conflicts with SHARE ROW EXCLUSIVE). On a partitioned table the trigger is cloned to every partition under the same lock (PG 11+)."

  # --- insert: 633 wild (4.1%) ---------------------------------------------
  insert:
    - pg_versions: [10, 18]
      when: {source: [values, default_values]}
      calibration: CALIBRATED
      lock_mode: ROW EXCLUSIVE
      blocks_reads: false
      blocks_writes: false
      requires_table_rewrite: false
      duration_model: CONSTANT
      source:
        - "doc:18/explicit-locking.html#LOCKING-TABLES: 'The commands UPDATE, DELETE, INSERT, and MERGE acquire this lock mode [ROW EXCLUSIVE] on the target table'"
      notes: "VALUES / DEFAULT VALUES insert a bounded row set. ROW EXCLUSIVE conflicts only with SHARE and stronger, so concurrent reads and writes proceed; the statement merely blocks (and is blocked by) DDL such as CREATE INDEX or ALTER TABLE. FK checks take KEY SHARE row locks on referenced rows. ON CONFLICT DO UPDATE additionally row-locks conflicting rows."
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: ROW EXCLUSIVE
      blocks_reads: false
      blocks_writes: false
      requires_table_rewrite: false
      duration_model: PROPORTIONAL_TO_ROWS_MATCHED
      requires_live_context: true
      live_context: "row count of the feeding SELECT (source table sizes and predicate selectivity) — not knowable from the statement"
      affected_relations:
        - {role: target, lock_mode: ROW EXCLUSIVE}
        - {role: source_relations, lock_mode: ACCESS SHARE}
      source:
        - "doc:18/explicit-locking.html#LOCKING-TABLES: 'The commands UPDATE, DELETE, INSERT, and MERGE acquire this lock mode [ROW EXCLUSIVE] on the target table (in addition to ACCESS SHARE locks on any other referenced tables)'"
      notes: "INSERT ... SELECT (default row: InsertDetails.source == 'select'). Duration follows the feeding query; a long-running copy-backfill holds ROW EXCLUSIVE on the target and ACCESS SHARE on the sources for its whole runtime (pins xmin; blocks any ALTER TABLE / CREATE INDEX queued behind it) but does not block concurrent DML."

  # --- update: 599 wild (3.9%) ---------------------------------------------
  update:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: ROW EXCLUSIVE
      blocks_reads: false
      blocks_writes: true
      write_block_scope: MATCHED_ROWS
      row_locks: "FOR NO KEY UPDATE on each matched row (FOR UPDATE if a key column changes)"
      requires_table_rewrite: false
      duration_model: PROPORTIONAL_TO_ROWS_MATCHED
      requires_live_context: true
      live_context: "number of rows matched by the WHERE clause (table size and predicate selectivity) — not knowable from the statement alone; do not guess"
      source:
        - "doc:18/explicit-locking.html#LOCKING-TABLES: 'The commands UPDATE, DELETE, INSERT, and MERGE acquire this lock mode [ROW EXCLUSIVE] on the target table'"
        - "doc:18/explicit-locking.html#LOCKING-ROWS: 'FOR NO KEY UPDATE ... is also acquired by any UPDATE that does not acquire a FOR UPDATE lock'; 'FOR UPDATE ... is also acquired by any DELETE on a row, and also by an UPDATE that modifies the values of certain columns'"
      notes: "Has a WHERE clause but no recognized batching idiom. Matched rows stay locked until commit, so a concurrent UPDATE/DELETE of the same rows waits; rows not matched are untouched. Every updated row leaves a dead tuple (bloat proportional to rows matched) and the statement holds one snapshot for its whole runtime. Unbatched on a large table this is the classic long-running backfill."

  # --- create_function: 573 wild (3.7%) ------------------------------------
  create_function:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: NONE
      blocks_reads: false
      blocks_writes: false
      requires_table_rewrite: false
      duration_model: CONSTANT
      affected_relations: []
      source:
        - "src:REL_18_STABLE/src/backend/commands/functioncmds.c CreateFunction / ProcedureCreate: pg_proc row insert/update only; no relation is opened (grep: no AccessExclusiveLock/ShareUpdateExclusiveLock in functioncmds.c)"
      notes: "Pure catalog work on pg_proc. CREATE OR REPLACE of a function that concurrent sessions are executing is safe (they finish on the old definition; plan caches invalidate). Harmless to table traffic."

  # --- commit: 493 wild (3.2%) / begin: 302 wild (2.0%) --------------------
  commit:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: NONE
      blocks_reads: false
      blocks_writes: false
      requires_table_rewrite: false
      duration_model: CONSTANT
      affected_relations: []
      source:
        - "doc:18/explicit-locking.html#LOCKING-TABLES: 'Once acquired, a lock is normally held until the end of the transaction.'"
      notes: "Releases every lock the transaction holds. COMMIT AND CHAIN (TransactionDetails.chain) immediately starts a new transaction with the same characteristics."
  begin:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: NONE
      blocks_reads: false
      blocks_writes: false
      requires_table_rewrite: false
      duration_model: CONSTANT
      affected_relations: []
      source:
        - "doc:18/sql-begin.html: 'BEGIN initiates a transaction block ... statements after the BEGIN command are executed in a single transaction until an explicit COMMIT or ROLLBACK'"
      notes: "Locks taken by every following statement are held until the matching COMMIT/ROLLBACK, so lock hold time is the whole block, not the individual statement."

  # --- create_view: 468 wild (3.0%) ----------------------------------------
  create_view:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: ACCESS SHARE
      blocks_reads: false
      blocks_writes: false
      requires_table_rewrite: false
      duration_model: CONSTANT
      affected_relations:
        - {role: source_relations, lock_mode: ACCESS SHARE}
      source:
        - "src:REL_18_STABLE/src/backend/commands/view.c DefineVirtualRelation: lockmode = replace ? AccessExclusiveLock : NoLock (on an existing view being replaced); referenced tables are opened with AccessShareLock during parse analysis of the defining query"
        - "src:REL_18_STABLE/src/backend/commands/tablecmds.c AlterTableGetLockLevel: AT_ReplaceRelOptions 'Only used by CREATE OR REPLACE VIEW which must conflict with an SELECTs currently using the view' -> AccessExclusiveLock"
      notes: "Defining a new view only parses the query (ACCESS SHARE on the underlying tables, released at commit; no data is read). CREATE OR REPLACE VIEW of an existing view takes a brief ACCESS EXCLUSIVE lock on the view itself, so readers of that view wait for the statement — the classifier does not record OR REPLACE, so that case is not split out here."

  # --- alter_enum_add_value: 389 wild (2.5%) -------------------------------
  alter_enum_add_value:
    - pg_versions: [10, 11]
      calibration: CALIBRATED
      lock_mode: NONE
      blocks_reads: false
      blocks_writes: false
      requires_table_rewrite: false
      duration_model: CONSTANT
      transaction_block: FORBIDDEN
      failure_mode: "ERROR: ALTER TYPE ... ADD cannot run inside a transaction block — unless the enum type was created in the same transaction. Migration runners that wrap files in a transaction fail here."
      affected_relations: []
      source:
        - "doc:11/sql-altertype.html §Notes: 'ALTER TYPE ... ADD VALUE (the form that adds a new value to an enum type) cannot be executed inside a transaction block.'"
        - "src:REL_11_STABLE/src/backend/commands/typecmds.c AlterEnum: PreventInTransactionBlock(isTopLevel, 'ALTER TYPE ... ADD')"
        - "src:REL_12_STABLE/src/backend/catalog/pg_enum.c AddEnumLabel: LockDatabaseObject(TypeRelationId, enumTypeOid, 0, ExclusiveLock) (object lock on the type, not a relation lock)"
      notes: "Catalog-only (pg_enum row, object-level lock on the type). No table is locked; columns of the type are unaffected."
    - pg_versions: [12, 16]
      calibration: CALIBRATED
      lock_mode: NONE
      blocks_reads: false
      blocks_writes: false
      requires_table_rewrite: false
      duration_model: CONSTANT
      transaction_block: RESTRICTED
      failure_mode: "Using the new value in the same transaction (INSERT/UPDATE/DEFAULT with the new label) fails with 'unsafe use of new value' — it is usable only after COMMIT, even if the type was created in this transaction."
      affected_relations: []
      source:
        - "doc:12/sql-altertype.html §Notes: 'If ALTER TYPE ... ADD VALUE (the form that adds a new value to an enum type) is executed inside a transaction block, the new value cannot be used until after the transaction has been committed.'"
        - "release:12 'Allow enumerated values to be added more flexibly ... Now it can be called in a later transaction, so long as the new enumerated value is not referenced until after it is committed.'"
        - "src:REL_12_STABLE/src/backend/catalog/pg_enum.c AddEnumLabel: LockDatabaseObject(TypeRelationId, enumTypeOid, 0, ExclusiveLock)"
      notes: "Catalog-only; no relation lock. Safe in a transaction block as long as no statement in the same transaction references the new value."
    - pg_versions: [17, 18]
      calibration: CALIBRATED
      lock_mode: NONE
      blocks_reads: false
      blocks_writes: false
      requires_table_rewrite: false
      duration_model: CONSTANT
      transaction_block: RESTRICTED
      failure_mode: "Using the new value in the same transaction fails with 'unsafe use of new value' unless the enum type itself was created in this transaction."
      affected_relations: []
      source:
        - "release:17 'Allow the use of an ENUM added via ALTER TYPE if the type was created in the same transaction (Tom Lane). This was previously disallowed.'"
        - "doc:17/sql-altertype.html §Notes (same restriction as 12, with the same-transaction exception)"
      notes: "Catalog-only; no relation lock. CREATE TYPE ... AS ENUM + ALTER TYPE ... ADD VALUE + INSERT in one transaction works from 17."

  # --- drop_index: 369 wild (2.4%) -----------------------------------------
  drop_index:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: ACCESS EXCLUSIVE
      blocks_reads: true
      blocks_writes: true
      requires_table_rewrite: false
      duration_model: CONSTANT
      affected_relations:
        - {role: target, lock_mode: ACCESS EXCLUSIVE}
        - {role: additional_targets, lock_mode: ACCESS EXCLUSIVE, optional: true}
        - {role: owning_table, lock_mode: ACCESS EXCLUSIVE}
      source:
        - "src:REL_18_STABLE/src/backend/catalog/index.c index_drop: 'We must therefore take a table lock strong enough to prevent all queries on the table from proceeding until we commit' — lockmode = concurrent ? ShareUpdateExclusiveLock : AccessExclusiveLock; userHeapRelation = table_open(heapId, lockmode); userIndexRelation = index_open(indexId, lockmode)"
        - "doc:18/sql-reindex.html §Notes: 'DROP INDEX momentarily takes an ACCESS EXCLUSIVE lock on the parent table, blocking both writes and reads.'"
      notes: "Brief, but ACCESS EXCLUSIVE on BOTH the index and its table: every query on the table blocks until commit, and the statement itself queues behind any long-running query or transaction touching the table (and then everything queues behind it). The owning table is not named in the statement."

  # --- drop_view: 329 wild (2.1%) ------------------------------------------
  drop_view:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: ACCESS EXCLUSIVE
      blocks_reads: true
      blocks_writes: true
      requires_table_rewrite: false
      duration_model: CONSTANT
      affected_relations:
        - {role: target, lock_mode: ACCESS EXCLUSIVE}
        - {role: additional_targets, lock_mode: ACCESS EXCLUSIVE, optional: true}
        - {role: dependent_relations, lock_mode: ACCESS EXCLUSIVE, optional: true}
      source:
        - "src:REL_18_STABLE/src/backend/commands/tablecmds.c RemoveRelations: LOCKMODE lockmode = AccessExclusiveLock (reduced to ShareUpdateExclusiveLock only for DROP INDEX CONCURRENTLY)"
        - "src:REL_18_STABLE/src/backend/catalog/dependency.c deleteOneObject: LockRelationOid(object->objectId, AccessExclusiveLock) for dependent relations"
      notes: "Brief catalog drop; readers of the view wait for commit. With CASCADE, dependent views are dropped under ACCESS EXCLUSIVE too (unknown statically). The base tables are not locked."

  # --- rename_column: 290 wild (1.9%) --------------------------------------
  rename_column:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: ACCESS EXCLUSIVE
      blocks_reads: true
      blocks_writes: true
      requires_table_rewrite: false
      duration_model: CONSTANT
      source:
        - "src:REL_18_STABLE/src/backend/commands/tablecmds.c renameatt: targetrelation = relation_open(myrelid, AccessExclusiveLock) (and child_oids = find_all_inheritors(myrelid, AccessExclusiveLock, ...) for inheritance/partition children)"
        - "doc:18/sql-altertable.html §Description: 'An ACCESS EXCLUSIVE lock is acquired unless explicitly noted.'"
