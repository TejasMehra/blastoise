  # --- delete_without_where: 20 wild (0.1%) --------------------------------
  delete_without_where:
    - pg_versions: [10, 18]
      calibration: CALIBRATED
      lock_mode: ROW EXCLUSIVE
      blocks_reads: false
      blocks_writes: true
      write_block_scope: MATCHED_ROWS
      row_locks: "FOR UPDATE on every row"
      requires_table_rewrite: false
      duration_model: PROPORTIONAL_TO_ROWS
      requires_live_context: true
      live_context: "table row count — every row is matched"
      source:
        - "doc:18/explicit-locking.html#LOCKING-TABLES: 'The commands UPDATE, DELETE, INSERT, and MERGE acquire this lock mode [ROW EXCLUSIVE] on the target table'"
