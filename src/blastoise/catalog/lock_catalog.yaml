      requires_live_context: true
      live_context: "rows produced by the defining query"
      affected_relations:
        - {role: source_relations, lock_mode: ACCESS SHARE}
      source:
        - "doc:18/explicit-locking.html#LOCKING-TABLES: 'ACCESS SHARE ... any query that only reads a table and does not modify it will acquire this lock mode'"
        - "src:REL_18_STABLE/src/backend/commands/createas.c ExecCreateTableAs (OBJECT_MATVIEW path): same mechanics as CREATE TABLE AS"
