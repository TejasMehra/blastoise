# The Action, run against this repository, on every change to it.
#
# This repository has no migrations of its own, so the check finds nothing
# and passes. That is still worth running: an Action whose composite steps
# do not parse, or whose install step is broken, fails here rather than in
# somebody else's pull request. The second job proves the same code path
# through the Docker image, on a fixture with a migration that really does
# block.
name: blastoise

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  action:
    name: the Action, on this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          version: local
          offline: "true"
          artifact-name: blastoise-self-check

  image:
    name: the Docker image, on a fixture that blocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t blastoise:ci .

      # Asserted separately from the run below, which passes --user and so
      # would pass whatever the image's own default were.
      - name: The image does not run as root
        run: |
          set -euo pipefail
          uid="$(docker run --rm --entrypoint id blastoise:ci -u)"
          name="$(docker run --rm --entrypoint id blastoise:ci -un)"
          echo "default user: ${name} (uid ${uid})"
          [ "${uid}" -ne 0 ] || { echo "the image runs as root"; exit 1; }
          [ "${name}" = "blastoise" ] || { echo "unexpected default user"; exit 1; }

      - name: A migration that must be blocked
        run: |
          set -euo pipefail
          mkdir -p fixture/migrations
          printf 'BEGIN;\nCREATE INDEX CONCURRENTLY i ON events (plan);\nCOMMIT;\n' \
            > fixture/migrations/0001_index.sql
          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/fixture:/repo" -w /repo blastoise:ci \
            ci --offline --no-comment --no-check-run \
               --comment-output /repo/comment.md \
               migrations/0001_index.sql
          code=$?
          set -e
          echo "exit code: ${code}"
          [ "${code}" -eq 2 ] || { echo "expected exit 2 (block), got ${code}"; exit 1; }
          grep -q "BLOCK" fixture/comment.md
          # The limits section is always rendered and never collapsed, and
          # a blocking file opens its statement table rather than hiding the
          # finding behind a click.
          grep -q "couldn't establish" fixture/comment.md
          grep -q "<details open>" fixture/comment.md
