[project]
name = "pgverdict"
version = "0.1.0"
description = "Analyze Postgres schema migrations for production safety"
readme = "README.md"
authors = [
    { name = "Tejas Mehra", email = "tejasmehra04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pglast>=8.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
live = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
pgverdict = "pgverdict.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "psycopg[binary]>=3.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "testcontainers>=4.8",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pgverdict"]
